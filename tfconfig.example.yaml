# ── Service defaults ──────────────────────────────────
# Non-secret local ports live here. Secrets stay in .env.
services:
  # Shared retention policy for local TF-managed logs and JSONL records.
  # Default is 3 days when omitted.
  log_retention_days: 3
  frontend:
    # Admin account used only for frontend system-daemon sudo operations.
    admin_user: admin
  olla:
    port: 40115
    log_level: debug
    version: v0.0.27
    # Optional: use an already-compiled local Olla binary and skip release download in `cluster prepare`.
    # local_binary: /absolute/path/to/olla
    os: macos
    arch: arm64
    bin_dir: olla-bin
  edge:
    # Authenticated TF edge is the LAN-facing API. Keep raw Olla loopback-only.
    host: "0.0.0.0"
    port: 40116
    access_log: logs/tf-edge-access.jsonl
  omlx:
    port: 8018

# ── Operator workflow defaults ──────────────────────────────────
# Non-secret command defaults used by `make smoke` and `make sync`.
operations:
  smoke:
    alias: memory
    client_id: admin
    timeout: 30
  sync:
    transport: auto
    timeout: 7200
    restart_runtime: true
  usage:
    # Exclude non-LLM tool models from usage model breakdowns.
    exclude_models:
      - MarkItDown

# ── Model registry ──────────────────────────────────
# Add new models here. Model ids are public aliases by default.
# Source types:
#   huggingface  — pre-converted MLX weights from any HF repo
#   convert      — auto-convert + quantize any HF model to MLX
#   local        — model already on disk (manual management)
#   pip          — installable tool (image/video gen, not served by vllm-mlx)
models:
  coder:
    source:
      repo: "mlx-community/Qwen3-Coder-Next-4bit"
    runtime_model_id: Qwen3-Coder-Next-4bit
    disk_gb: 44.8
    kv_per_32k_gb: 0.75
    active_params: "3B of 80B"
    max_context: 262144
    notes: "SOTA agentic coding. Tool calling, error recovery, 262K context."

  coder-better:
    source:
      repo: "mlx-community/Qwen3-Coder-Next-mxfp8"
    runtime_model_id: Qwen3-Coder-Next-mxfp8
    disk_gb: 82.2
    kv_per_32k_gb: 0.75
    active_params: "3B of 80B"
    max_context: 262144
    notes: "MXFP8 Qwen3 Coder Next candidate. Higher fidelity than 4bit; heavier disk/RAM budget."

  agent:
    source:
      repo: "mlx-community/Qwen3.6-35B-A3B-4bit"
    runtime_model_id: Qwen3.6-35B-A3B-4bit
    disk_gb: 20.5
    kv_per_32k_gb: 0.5
    active_params: "3B of 35B"
    max_context: 262144
    notes: "Fast agent. 73.4% SWE-bench. Thinking mode by default."

  agent-better:
    source:
      repo: "mlx-community/Qwen3.6-35B-A3B-mxfp8"
    runtime_model_id: Qwen3.6-35B-A3B-mxfp8
    disk_gb: 36.6
    kv_per_32k_gb: 0.5
    active_params: "3B of 35B"
    max_context: 262144
    notes: "MXFP8 Qwen3.6 35B A3B candidate for higher-quality agent routing. Higher fidelity than 4bit; heavier disk/RAM budget."

  # agent-heavy:
  #   source:
  #     repo: "mlx-community/Qwen3.5-122B-A10B-4bit"
  #   runtime_model_id: Qwen3.5-122B-A10B-4bit
  #   disk_gb: 65.0
  #   kv_per_32k_gb: 1.2
  #   active_params: "10B of 122B"
  #   max_context: 131072
  #   notes: "Heavy agent. 122B MoE with VLM support. Thinking mode."

  memory:
    source:
      repo: "mlx-community/gpt-oss-20b-MXFP4-Q8"
    runtime_model_id: gpt-oss-20b-MXFP4-Q8
    disk_gb: 11.0
    ram_gb: 14.0
    kv_per_32k_gb: 6.0
    max_context: 131072
    notes: "Hindsight LLM role. Standard oMLX serve; reasoning models may return reasoning_content. Canonical role alias: memory."

  memory-bf16:
    source:
      repo: "mlx-community/gpt-oss-20b-mxfp4-bf16"
    runtime_model_id: gpt-oss-20b-mxfp4-bf16
    benchmark_only: true
    disk_gb: 13.0
    ram_gb: 16.0
    kv_per_32k_gb: 6.0
    max_context: 131072
    notes: "Temporary comparison route for the memory role. Keep canonical memory on Q8 until BF16 is benchmarked."

# ── Model placement ─────────────────────────────────
# Single TF v2 source of truth for serving aliases and node placement.
# Model registry keys are public aliases; runtime_model_id is the oMLX model id.
# Canonical public aliases: memory, coder, agent.
# Use memory for the Hindsight LLM; do not add a second Hindsight memory alias.
# Example rollout mirror: infer-01/infer-02/infer-03 expose memory, coder, and agent variants.
# Future production spread can narrow back to memory+coder or memory+agent after burn-in.
# Olla LRU manages active model loading — not all models loaded simultaneously.
# Each node has 128GB RAM. Budget memory at ~20GB runtime RAM and coder/agent
# at ~40-90GB runtime RAM, leaving OS/MLX/KV-cache headroom to prevent swap.

# ── Nodes ──────────────────────────────────────────
# Per-node host may be a DNS name or IP address. Prefer .lan FQDNs.
# Per-node user is optional. Falls back to GATEWAY_SSH_USER from .env,
# then $USER (current OS user). Roles are "gateway", "cache", and "inference".
# admin_user is optional and names the local/remote admin account used for sudo things.
nodes:
  # Split gateway example; commented when using a combined gateway/cache host.
  # gateway-01:
  #   host: "gateway-01.lan"
  #   ram_gb: 32
  #   roles: [gateway]
  #   admin_user: <gateway-admin>

  gateway-cache-01:
    host: "gateway-cache-01.lan"
    ram_gb: 128
    roles: [gateway, cache]
    user: user1
    admin_user: admin

  # Current rollout state:
  # - infer-01/infer-02/infer-03 are TF v2 inference nodes with mirrored model sets.
  # - infer-04 can stay reserved for a direct oMLX workload and migrate last.

  infer-01:
    host: "infer-01.lan"
    # Boolean: probe Thunderbolt/fabric dynamically from the management host.
    fabric_host: true
    ram_gb: 128
    roles: [inference]
    user: user1
    admin_user: admin
    runtime:
      type: omlx
      trusted_network: true
    models:
      - memory
      - memory-bf16
      - agent
      - agent-better
      - coder
      - coder-better

  infer-02:
    host: "infer-02.lan"
    # Boolean: probe Thunderbolt/fabric dynamically from the management host.
    fabric_host: true
    ram_gb: 128
    roles: [inference]
    user: user1
    admin_user: admin
    runtime:
      type: omlx
      trusted_network: true
    models:
      - memory
      - memory-bf16
      - agent
      - agent-better
      - coder
      - coder-better

  infer-03:
    host: "infer-03.lan"
    # Boolean: probe Thunderbolt/fabric dynamically from the management host.
    fabric_host: true
    ram_gb: 128
    roles: [inference]
    user: user1
    admin_user: admin
    runtime:
      type: omlx
      trusted_network: true
    models:
      - memory
      - memory-bf16
      - agent
      - agent-better
      - coder
      - coder-better

  # infer-04: enable when migrating a reserved direct oMLX workload into TF v2.
  # host: "infer-04.lan"
