# ── Service defaults ──────────────────────────────────
# Non-secret local ports live here. Secrets stay in .env.
services:
  frontend:
    # Admin account used only for frontend system-daemon sudo operations.
    admin_user: admin
  olla:
    port: 40115
  edge:
    port: 40116
    access_log: logs/tf-edge-access.jsonl
  omlx:
    port: 8018

# ── Model registry ──────────────────────────────────
# Add new models here. Model ids are public aliases by default.
# Source types:
#   huggingface  — pre-converted MLX weights from any HF repo
#   convert      — auto-convert + quantize any HF model to MLX
#   local        — model already on disk (manual management)
#   pip          — installable tool (image/video gen, not served by vllm-mlx)
models:
  coder:
    source:
      repo: "mlx-community/Qwen3-Coder-Next-4bit"
    runtime_model_id: Qwen3-Coder-Next-4bit
    disk_gb: 44.8
    kv_per_32k_gb: 0.75
    active_params: "3B of 80B"
    max_context: 262144
    notes: "SOTA agentic coding. Tool calling, error recovery, 262K context."

  agent:
    source:
      repo: "mlx-community/Qwen3.6-35B-A3B-4bit"
    runtime_model_id: Qwen3.6-35B-A3B-4bit
    disk_gb: 20.5
    kv_per_32k_gb: 0.5
    active_params: "3B of 35B"
    max_context: 262144
    notes: "Fast agent. 73.4% SWE-bench. Thinking mode by default."

  agent-heavy:
    source:
      repo: "mlx-community/Qwen3.5-122B-A10B-4bit"
    runtime_model_id: Qwen3.5-122B-A10B-4bit
    disk_gb: 65.0
    kv_per_32k_gb: 1.2
    active_params: "10B of 122B"
    max_context: 131072
    notes: "Heavy agent. 122B MoE with VLM support. Thinking mode."

  memory:
    source:
      repo: "mlx-community/gpt-oss-20b-MXFP4-Q8"
    runtime_model_id: gpt-oss-20b-MXFP4-Q8
    disk_gb: 11.0
    ram_gb: 14.0
    kv_per_32k_gb: 6.0
    max_context: 131072
    notes: "Hindsight LLM role. Standard oMLX serve; reasoning models may return reasoning_content. Canonical role alias: memory."

  memory-bf16:
    source:
      repo: "mlx-community/gpt-oss-20b-mxfp4-bf16"
    runtime_model_id: gpt-oss-20b-mxfp4-bf16
    benchmark_only: true
    disk_gb: 13.0
    ram_gb: 16.0
    kv_per_32k_gb: 6.0
    max_context: 131072
    notes: "Temporary comparison route for the memory role. Keep canonical memory on Q8 until BF16 is benchmarked."

# ── Model placement ─────────────────────────────────
# Single TF v2 source of truth for serving aliases and node placement.
# Model registry keys are public aliases; runtime_model_id is the oMLX model id.
# Canonical public aliases: memory, coder, agent.
# Use memory for the Hindsight LLM; do not add a second Hindsight memory alias.
# Target spread: Memory + Coder (msm1, msm2) or Memory + Agent (msm3, msm4).
# Olla LRU manages active model loading — not all models loaded simultaneously.
# Each node has 128GB RAM. Budget memory at ~20GB runtime RAM and coder/agent
# at ~40-90GB runtime RAM, leaving OS/MLX/KV-cache headroom to prevent swap.
# Stage migrations after msm3 is stable: msm1, then msm2, then msm4.

# ── Nodes ──────────────────────────────────────────
# Per-node host may be a DNS name or IP address. Prefer .lan FQDNs.
# Per-node user is optional. Falls back to GATEWAY_SSH_USER from .env,
# then $USER (current OS user). Roles are "gateway", "cache", and "inference".
# admin_user is optional and names the local/remote admin account used for sudo things.
nodes:
  # Production frontend; commented for the dev setup on studio.
  # rock:
  #   host: "rock.lan"
  #   ram_gb: 32
  #   roles: [gateway]
  #   admin_user: <rock-admin>

  studio:
    host: "studio.lan"
    ram_gb: 128
    roles: [gateway, cache]
    user: user1
    admin_user: admin

  # Current rollout state:
  # - msm1/msm2 are TF v1 production nodes and migrate after msm3 is stable.
  # - msm3 is the dedicated TF v2 dev node.
  # - msm4 is direct oMLX for Hindsight today and migrates last.

  # msm1:
  #   host: "msm1-wifi.lan"
  #   ram_gb: 128
  #   roles: [inference]
  #   user: user1
  #   admin_user: admin
  #   runtime:
  #     type: omlx
  #   models:
  #     - memory
  #     - coder

  # msm2:
  #   host: "msm2-wifi.lan"
  #   ram_gb: 128
  #   roles: [inference]
  #   user: user1
  #   admin_user: admin
  #   runtime:
  #     type: omlx
  #   models:
  #     - memory
  #     - coder

  msm3:
    host: "msm3-wifi.lan"
    # Boolean: probe Thunderbolt/fabric dynamically from the management host.
    fabric_host: true
    ram_gb: 128
    roles: [inference]
    user: user1
    admin_user: admin
    runtime:
      type: omlx
    models:
      - memory
      - memory-bf16
      - agent
      - agent-heavy

  # msm4: enable when migrating direct Hindsight oMLX into TF v2.
  # host: "msm4-wifi.lan"
  # ram_gb: 128
  # roles: [inference]
  # user: user1
  # admin_user: admin
  # runtime:
  #   type: omlx
  # models:
  #   - memory
  #   - agent
